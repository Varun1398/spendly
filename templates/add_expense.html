{% extends "base.html" %}

{% block title %}Add expense — Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/add_expense.css') }}">
{% endblock %}

{% block content %}
<section class="exp-page">
    <div class="exp-header">
        <h1 class="exp-title">Add expense</h1>
        <p class="exp-subtitle">Record what you spent so your profile stays up to date.</p>
    </div>

    <div class="exp-card">
        {% if error %}
        <div class="auth-error" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('add_expense') }}">
            <div class="exp-row">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" name="amount" class="form-input"
                           step="0.01" min="0.01" inputmode="decimal" placeholder="0.00"
                           value="{{ values.get('amount', '') }}" required autofocus>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" class="form-input"
                           max="{{ today }}" value="{{ values.get('date', '') }}" required>
                </div>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" class="form-input" required>
                    <option value="" disabled {% if not values.get('category') %}selected{% endif %}>Choose a category</option>
                    {% for c in categories %}
                    <option value="{{ c }}" {% if values.get('category') == c %}selected{% endif %}>{{ c }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="description">Description <span class="exp-optional">(optional)</span></label>
                <input type="text" id="description" name="description" class="form-input"
                       maxlength="200" placeholder="e.g. Lunch at cafe"
                       value="{{ values.get('description', '') }}">
            </div>

            <div class="exp-actions">
                <button type="submit" class="btn-submit">Add expense</button>
                <a href="{{ url_for('profile') }}" class="exp-cancel">Cancel</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
